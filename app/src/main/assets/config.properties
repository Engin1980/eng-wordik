# Konfigurace aplikace Wordík. Změna znamená nové sestavení aplikace.
# Kódování UTF-8, formát java.util.Properties.

# Výchozí hodnoty nastavení testu
# mode: CHOICE (výběr z variant) nebo ASSEMBLY (skládání z písmen)
default.mode=ASSEMBLY
default.wrongOptions=4
default.minPasses=2
default.minSuccessPercent=50
default.extraLetters=0
# evaluation: WHOLE_WORD nebo PER_LETTER
default.evaluation=PER_LETTER
# direction: CZECH_TO_FOREIGN, FOREIGN_TO_CZECH nebo MIX
default.direction=MIX

# Povolené rozsahy (od-do, obě meze včetně)
range.wrongOptions=1-8
range.minPasses=1-10
range.minSuccessPercent=1-100
range.extraLetters=0-10

# Prodleva automatického přechodu na další slovíčko po správné odpovědi (ms)
autoAdvanceMillis=1000

# Font pro slovíčka; musí jasně rozlišovat znaky l, I a 1.
font=Atkinson Hyperlegible
